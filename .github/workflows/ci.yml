name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # On main a run in progress always finishes; GitHub keeps one pending run per group, so a newer push replaces
  # only the pending one. Cancelling in-progress main runs left most pushes without a result when the safe-delete
  # fixtures were a single ~90-minute job.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI_PROJECT_ROOT: D:\agents\projects\统一环境

jobs:
  # A push or pull request that changes only docs/**/*.md skips the safe-delete-fixtures job. Any other event, the
  # first push of a branch, or a diff that cannot be computed runs every job.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify the changed paths
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          range=
          case "$EVENT" in
            push) [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ] && range="$PUSH_BEFORE..$PUSH_AFTER" ;;
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
          esac
          docs_only=false
          files=
          if [ -n "$range" ] && files=$(git -c core.quotePath=false diff --name-only "$range" --) && [ -n "$files" ]; then
            if ! grep -qvE '^docs/.+\.md$' <<<"$files"; then docs_only=true; fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "range: ${range:-none}; docs_only=$docs_only"
          sed -n '1,50p' <<<"$files"

  module-boundaries:
    name: Module boundaries
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'

      - name: Prepare canonical project path
        shell: pwsh
        run: |
          $projectParent = Split-Path -Parent $env:CI_PROJECT_ROOT
          New-Item -ItemType Directory -Path $projectParent -Force | Out-Null
          New-Item -ItemType Directory -Path $env:CI_PROJECT_ROOT -Force | Out-Null
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force |
            Copy-Item -Destination $env:CI_PROJECT_ROOT -Recurse -Force

      - name: Validate ownership and interfaces
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:CI_PROJECT_ROOT
          node .\tests\Test-ModuleBoundaries.cjs
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify read-only Codex config checker
        shell: pwsh
        working-directory: ${{ env.CI_PROJECT_ROOT }}
        run: |
          python -B tests/Test-CodexConfig.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  fixtures:
    name: ${{ matrix.name || format('{0} fixtures', matrix.module) }}
    runs-on: windows-latest
    # Per-suite timings put the slowest shard near 9 minutes on the slowest runners seen; 30 stops a hung suite early.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: shared
            profile: fixture
          - module: dev-environment
            profile: ci
          - module: skill-supply-chain
            profile: fixture
          # The host-safety fixture suites split by name into shards across two jobs. The 10k-file scale suites take
          # most of the time, so each runs in its own heavy shard; rest A-M takes Test-CodexSafeTreeDelete.ps1 and
          # Test-CodexSafeTreeDelete[A-M]*.ps1 except HashReuse. Those six shards make up the safe-delete-fixtures job
          # below. rest, here, skips the heavy suites and those names, so a new suite lands in exactly one shard. Edit a
          # heavy shard's only pattern and both rest patterns together. A heavy pattern that matches no suite fails its
          # job, so renaming a scale suite cannot drop it silently. rest stays in this job, which a docs-only change
          # still runs, because Test-CodexSafeTreeDeleteRetiredEvidenceRoot.ps1 reads docs/specs.
          - module: host-safety
            profile: fixture
            name: host-safety fixtures (rest)
            skip: '^Test-CodexSafeTreeDelete(PurgeBatch|PurgeHashReuse|Phase1Integration|Phase3Integration|[A-M]\w*)?\.ps1$'
          # Host diagnostics finish in minutes; a separate job keeps their feedback off the long safe-delete shards.
          - module: host-safety
            profile: diagnostics
            name: host-safety diagnostics
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'

      - uses: actions/setup-python@v6
        if: matrix.module == 'skill-supply-chain' || matrix.module == 'host-safety'
        with:
          python-version: '3.15'

      - name: Prepare canonical project path
        shell: pwsh
        run: |
          $projectParent = Split-Path -Parent $env:CI_PROJECT_ROOT
          New-Item -ItemType Directory -Path $projectParent -Force | Out-Null
          New-Item -ItemType Directory -Path $env:CI_PROJECT_ROOT -Force | Out-Null
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force |
            Copy-Item -Destination $env:CI_PROJECT_ROOT -Recurse -Force

      - name: Prepare managed Python runtime
        if: matrix.module == 'skill-supply-chain'
        shell: pwsh
        run: |
          $sourcePython = Join-Path $env:pythonLocation 'python.exe'
          & $sourcePython -I -m pip install 'PyYAML==6.0.3'
          $pipExit = $LASTEXITCODE
          if ($pipExit -ne 0) { exit $pipExit }

          $managedPythonRoot = 'D:\Codex\tools\python315-official'
          $managedToolsRoot = Split-Path -Parent $managedPythonRoot
          New-Item -ItemType Directory -Path $managedToolsRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $managedPythonRoot -Force | Out-Null
          Get-ChildItem -LiteralPath $env:pythonLocation -Force |
            Copy-Item -Destination $managedPythonRoot -Recurse -Force

          $managedPython = Join-Path $managedPythonRoot 'python.exe'
          & $managedPython -I -c 'import yaml; assert callable(yaml.safe_load)'
          $probeExit = $LASTEXITCODE
          if ($probeExit -ne 0) { exit $probeExit }

      - name: Run module fixture tests
        shell: pwsh
        env:
          FIXTURE_ONLY: ${{ matrix.only }}
          FIXTURE_SKIP: ${{ matrix.skip }}
        run: |
          Set-Location -LiteralPath $env:CI_PROJECT_ROOT
          $selection = @()
          if ($env:FIXTURE_ONLY) { $selection += '--only', $env:FIXTURE_ONLY }
          if ($env:FIXTURE_SKIP) { $selection += '--skip', $env:FIXTURE_SKIP }
          node .\scripts\Run-PowerShellTests.cjs --module '${{ matrix.module }}' --profile '${{ matrix.profile }}' @selection
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }

  python-node-fixtures:
    name: Python and Node fixtures
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'

      - name: Prepare canonical project path
        shell: pwsh
        run: |
          $projectParent = Split-Path -Parent $env:CI_PROJECT_ROOT
          New-Item -ItemType Directory -Path $projectParent -Force | Out-Null
          New-Item -ItemType Directory -Path $env:CI_PROJECT_ROOT -Force | Out-Null
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force |
            Copy-Item -Destination $env:CI_PROJECT_ROOT -Recurse -Force

      # The tests pin the managed Python and pwsh entrypoints and use D:\Codex\tmp as their fixture parent.
      - name: Prepare managed host paths
        shell: pwsh
        run: |
          $sourcePython = Join-Path $env:pythonLocation 'python.exe'
          & $sourcePython -I -m pip install 'PyYAML==6.0.3'
          $pipExit = $LASTEXITCODE
          if ($pipExit -ne 0) { exit $pipExit }

          $managedPythonRoot = 'D:\Codex\tools\python315-official'
          New-Item -ItemType Directory -Path $managedPythonRoot -Force | Out-Null
          Get-ChildItem -LiteralPath $env:pythonLocation -Force |
            Copy-Item -Destination $managedPythonRoot -Recurse -Force
          & (Join-Path $managedPythonRoot 'python.exe') -I -c 'import yaml; assert callable(yaml.safe_load)'
          $probeExit = $LASTEXITCODE
          if ($probeExit -ne 0) { exit $probeExit }

          # Tests launch this pwsh path to create junctions and run the overlay deployment fixture; the runner's PowerShell 7 stands in.
          $managedPwshRoot = 'D:\Codex\tools\PowerShell\7.6.5'
          New-Item -ItemType Directory -Path $managedPwshRoot -Force | Out-Null
          Get-ChildItem -LiteralPath $PSHOME -Force |
            Copy-Item -Destination $managedPwshRoot -Recurse -Force
          & (Join-Path $managedPwshRoot 'pwsh.exe') -NoProfile -NonInteractive -Command '"Managed pwsh stand-in: PowerShell $($PSVersionTable.PSVersion)"'
          $pwshExit = $LASTEXITCODE
          if ($pwshExit -ne 0) { exit $pwshExit }

          New-Item -ItemType Directory -Path 'D:\Codex\tmp' -Force | Out-Null
          New-Item -ItemType Directory -Path 'D:\Codex\temp' -Force | Out-Null

      # Host-bound tests are listed with their reasons in scripts/Run-ManifestTests.cjs and reported as warnings, not run.
      - name: Run manifest Python and Node fixture tests
        shell: pwsh
        env:
          PYTHON_PATH: D:\Codex\tools\python315-official\python.exe
          # The skill catalog generator only accepts D: paths, so fixture temp roots must not land on the C: runner temp.
          TEMP: D:\Codex\temp
          TMP: D:\Codex\temp
        run: |
          Set-Location -LiteralPath $env:CI_PROJECT_ROOT
          node .\scripts\Run-ManifestTests.cjs --exclude-host-bound
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }

  # The heavy host-safety shards and rest A-M (see the fixtures matrix), the longest jobs at up to ~9 minutes. Their
  # suites read no docs/ file (tests/Test-CiFixtureShards.py checks), so a change to docs/**/*.md alone skips them.
  safe-delete-fixtures:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: host-safety
            profile: fixture
            name: host-safety fixtures (PurgeBatch)
            only: '^Test-CodexSafeTreeDeletePurgeBatch\.ps1$'
          - module: host-safety
            profile: fixture
            name: host-safety fixtures (PurgeHashReuse)
            only: '^Test-CodexSafeTreeDeletePurgeHashReuse\.ps1$'
          - module: host-safety
            profile: fixture
            name: host-safety fixtures (HashReuse)
            only: '^Test-CodexSafeTreeDeleteHashReuse\.ps1$'
          - module: host-safety
            profile: fixture
            name: host-safety fixtures (Phase1)
            only: '^Test-CodexSafeTreeDeletePhase1Integration\.ps1$'
          - module: host-safety
            profile: fixture
            name: host-safety fixtures (Phase3)
            only: '^Test-CodexSafeTreeDeletePhase3Integration\.ps1$'
          - module: host-safety
            profile: fixture
            name: host-safety fixtures (rest A-M)
            only: '^Test-CodexSafeTreeDelete([A-M]\w*)?\.ps1$'
            skip: '^Test-CodexSafeTreeDeleteHashReuse\.ps1$'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'

      - name: Prepare canonical project path
        shell: pwsh
        run: |
          $projectParent = Split-Path -Parent $env:CI_PROJECT_ROOT
          New-Item -ItemType Directory -Path $projectParent -Force | Out-Null
          New-Item -ItemType Directory -Path $env:CI_PROJECT_ROOT -Force | Out-Null
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force |
            Copy-Item -Destination $env:CI_PROJECT_ROOT -Recurse -Force

      - name: Run module fixture tests
        shell: pwsh
        env:
          FIXTURE_ONLY: ${{ matrix.only }}
          FIXTURE_SKIP: ${{ matrix.skip }}
        run: |
          Set-Location -LiteralPath $env:CI_PROJECT_ROOT
          $selection = @()
          if ($env:FIXTURE_ONLY) { $selection += '--only', $env:FIXTURE_ONLY }
          if ($env:FIXTURE_SKIP) { $selection += '--skip', $env:FIXTURE_SKIP }
          node .\scripts\Run-PowerShellTests.cjs --module '${{ matrix.module }}' --profile '${{ matrix.profile }}' @selection
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
