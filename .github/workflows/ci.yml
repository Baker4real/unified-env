name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_PROJECT_ROOT: D:\agents\projects\统一环境

jobs:
  module-boundaries:
    name: Module boundaries
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'

      - name: Prepare canonical project path
        shell: pwsh
        run: |
          $projectParent = Split-Path -Parent $env:CI_PROJECT_ROOT
          New-Item -ItemType Directory -Path $projectParent -Force | Out-Null
          New-Item -ItemType Directory -Path $env:CI_PROJECT_ROOT -Force | Out-Null
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force |
            Copy-Item -Destination $env:CI_PROJECT_ROOT -Recurse -Force

      - name: Validate ownership and interfaces
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:CI_PROJECT_ROOT
          node .\tests\Test-ModuleBoundaries.cjs
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }

  fixtures:
    name: ${{ matrix.module }} fixtures
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: shared
            profile: fixture
          - module: dev-environment
            profile: ci
          - module: skill-supply-chain
            profile: fixture
          - module: host-safety
            profile: fixture
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'

      - uses: actions/setup-python@v6
        if: matrix.module == 'skill-supply-chain' || matrix.module == 'host-safety'
        with:
          python-version: '3.15'

      - name: Prepare canonical project path
        shell: pwsh
        run: |
          $projectParent = Split-Path -Parent $env:CI_PROJECT_ROOT
          New-Item -ItemType Directory -Path $projectParent -Force | Out-Null
          New-Item -ItemType Directory -Path $env:CI_PROJECT_ROOT -Force | Out-Null
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force |
            Copy-Item -Destination $env:CI_PROJECT_ROOT -Recurse -Force

      - name: Prepare managed Python runtime
        if: matrix.module == 'skill-supply-chain'
        shell: pwsh
        run: |
          $sourcePython = Join-Path $env:pythonLocation 'python.exe'
          & $sourcePython -I -m pip install 'PyYAML==6.0.3'
          $pipExit = $LASTEXITCODE
          if ($pipExit -ne 0) { exit $pipExit }

          $managedPythonRoot = 'D:\Codex\tools\python315-official'
          $managedToolsRoot = Split-Path -Parent $managedPythonRoot
          New-Item -ItemType Directory -Path $managedToolsRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $managedPythonRoot -Force | Out-Null
          Get-ChildItem -LiteralPath $env:pythonLocation -Force |
            Copy-Item -Destination $managedPythonRoot -Recurse -Force

          $managedPython = Join-Path $managedPythonRoot 'python.exe'
          & $managedPython -I -c 'import yaml; assert callable(yaml.safe_load)'
          $probeExit = $LASTEXITCODE
          if ($probeExit -ne 0) { exit $probeExit }

      - name: Run module fixture tests
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:CI_PROJECT_ROOT
          node .\scripts\Run-PowerShellTests.cjs --module '${{ matrix.module }}' --profile '${{ matrix.profile }}'
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
