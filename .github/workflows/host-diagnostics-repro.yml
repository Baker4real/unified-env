name: Host diagnostics repro

# Temporary. Run 38328829053 failed host diagnostics after the other host-safety fixtures had run on the same
# runner, while a fresh runner passes. This replays that order so the detailed failure message shows the cause.
# Remove once the cause is confirmed.
on:
  workflow_dispatch:
    inputs:
      before:
        description: Fixtures to run first (light leaves out the five long safe-tree-delete suites)
        type: choice
        options: [light, all]
        default: light

permissions:
  contents: read

env:
  CI_PROJECT_ROOT: D:\agents\projects\统一环境

jobs:
  repro:
    name: host diagnostics after ${{ inputs.before }} fixtures
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'

      - name: Prepare canonical project path
        shell: pwsh
        run: |
          $projectParent = Split-Path -Parent $env:CI_PROJECT_ROOT
          New-Item -ItemType Directory -Path $projectParent -Force | Out-Null
          New-Item -ItemType Directory -Path $env:CI_PROJECT_ROOT -Force | Out-Null
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force |
            Copy-Item -Destination $env:CI_PROJECT_ROOT -Recurse -Force

      - name: Run fixtures, then host diagnostics
        shell: pwsh
        env:
          BEFORE: ${{ inputs.before }}
        run: |
          Set-Location -LiteralPath $env:CI_PROJECT_ROOT
          $long = @(
            'Test-CodexSafeTreeDeleteHashReuse.ps1', 'Test-CodexSafeTreeDeletePhase1Integration.ps1',
            'Test-CodexSafeTreeDeletePhase3Integration.ps1', 'Test-CodexSafeTreeDeletePurgeBatch.ps1',
            'Test-CodexSafeTreeDeletePurgeHashReuse.ps1'
          )
          $listed = node .\scripts\Run-PowerShellTests.cjs --module host-safety --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Same alphabetical order as the fixture runner, up to where host diagnostics ran in run 38328829053.
          $before = @($listed | Where-Object { $_ -lt 'Test-HostDiagnostics.ps1' -and ($env:BEFORE -eq 'all' -or $_ -notin $long) })
          foreach ($test in $before + 'Test-HostDiagnostics.ps1') {
            "Running $test"
            pwsh -NoProfile -NonInteractive -File (Join-Path 'tests' $test)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
